import groovy.transform.Field
import java.util.jar.JarEntry
import java.util.jar.JarFile
import java.util.jar.JarOutputStream

plugins {
    id 'application'
    id "jacoco"
    id 'checkstyle'
    id "org.sonarqube" version "5.1.0.4882"
}

def config = new ConfigSlurper().parse(new File("$projectDir/src/main/resources/version.properties").toURI().toURL())
group = 'co.rsk'
version = config.modifier?.trim() ? config.modifier  + "-" + config.versionNumber : config.versionNumber

checkstyle {
    toolVersion = '12.2.0'
    configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
}

// Returns the list of changed *.java files relative to the 'ratchetFrom' project property
// (e.g. -PratchetFrom=origin/master), unioned with any uncommitted/staged local changes, or
// null when 'ratchetFrom' isn't provided -- meaning "no ratchet: check the full source set".
def runGit(List<String> command) {
    def out = new ByteArrayOutputStream()
    def err = new ByteArrayOutputStream()
    def result = exec {
        commandLine command
        standardOutput = out
        errorOutput = err
        ignoreExitValue = true
    }
    if (result.exitValue != 0) {
        throw new GradleException(
                "Cannot determine the ratcheted file set: '${command.join(' ')}' exited " +
                "${result.exitValue}. This usually means the -PratchetFrom ref isn't available " +
                "locally (e.g. the base branch wasn't fetched, or the ref is invalid).\nstderr:\n${err}"
        )
    }
    return out.toString()
}

@Field def ratchetedFilesComputed = false
@Field def ratchetedFilesCache = null

def getRatchetedFiles() {
    if (ratchetedFilesComputed) {
        return ratchetedFilesCache
    }
    ratchetedFilesComputed = true

    if (!project.hasProperty('ratchetFrom')) {
        return ratchetedFilesCache = null
    }

    def ratchetFrom = project.property('ratchetFrom')

    def baseDiffOutput = runGit(['git', 'diff', '--name-only', "${ratchetFrom}...HEAD"])
    def uncommittedOutput = runGit(['git', 'diff', '--name-only'])
    def stagedOutput = runGit(['git', 'diff', '--cached', '--name-only'])

    def baseDiffFiles = baseDiffOutput.trim().split('\n').toList()
    def uncommittedFiles = uncommittedOutput.trim().split('\n').toList()
    def stagedFiles = stagedOutput.trim().split('\n').toList()
    def allFiles = (baseDiffFiles + uncommittedFiles + stagedFiles).unique().findAll { file -> file }

    def projectRoot = project.projectDir.toPath().toAbsolutePath()

    allFiles = allFiles.findAll { file ->
        file.endsWith('.java')
    }.collect { file ->
        def absolutePath = projectRoot.resolve(file).toFile()
        return absolutePath.exists() ? absolutePath : null
    }.findAll { it != null }

    return ratchetedFilesCache = allFiles
}

def getFilteredFilesForCheckstyle(String sourceDir) {
    def files = getRatchetedFiles()
    if (files == null) {
        return null
    }
    return files.findAll { file ->
        def filePath = file.toPath().normalize()
        def isJavaFile = filePath.toString().endsWith('.java')
        def containsSourceSegment = filePath.toString().contains(sourceDir)

        isJavaFile && containsSourceSegment
    }
}

def configureCheckstyleTask(Checkstyle task, String sourceDir) {
    // For checkstyleFile task, the sources are set via -PfilePath parameter in task definition
    if (task.name == 'checkstyleFile') {
        if (!project.hasProperty('filePath')) {
            println "No filePath property provided. Skipping task ${task.name}"
            task.enabled = false
        } else {
            def filePaths = project.property('filePath').split(',').collect { it.trim() }
            task.source = project.files(filePaths)
        }
    } else {
        def ratchetedFiles = getFilteredFilesForCheckstyle(sourceDir)
        if (ratchetedFiles == null) {
            // No -PratchetFrom provided: leave the task's default (full) source set untouched.
        } else if (!ratchetedFiles.isEmpty()) {
            task.source = project.files(ratchetedFiles)
        } else {
            println "No changed files under ${sourceDir} relative to ratchetFrom. Skipping task ${task.name}."
            task.enabled = false
        }
    }

    task.reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

tasks.withType(Checkstyle).configureEach { Checkstyle task ->
    def sourceDirMapping = [
            'checkstyleMain': 'src/main/java',
            'checkstyleTest': 'src/test/java',
            'checkstyleFile': ''
    ]

    sourceDirMapping.each { taskName, sourceDir ->
        if (task.name == taskName) {
            configureCheckstyleTask(task, sourceDir)
        }
    }
}

task checkstyleAll {
    group = 'verification'
    description = 'Run all Checkstyle checks'
    dependsOn 'checkstyleMain', 'checkstyleTest'
}

task checkstyleFile(type: Checkstyle) {
    group = 'verification'
    description = 'Run Checkstyle on specific file(s) (use -PfilePath=file1.java or -PfilePath=file1.java,file2.java)'
    classpath = files()
}

test {
    useJUnitPlatform()

    beforeTest { descriptor ->
        logger.lifecycle("Running test: ${descriptor}")
    }

    jvmArgs '-Xss32m', '-Xmx3G'

    testLogging {
        events "failed"
        exceptionFormat "short"
    }
    systemProperty "file.encoding", "UTF-8"
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://deps.rsklabs.io"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

mainClassName = 'co.rsk.federate.FederateRunner'
applicationDefaultJvmArgs = ["-server", "-Xss32m", "-Xms3g", "-XX:+UseCompressedOops", "-XX:-OmitStackTraceInFastThrow"]

tasks.withType(JavaCompile){
    options.warnings = false
    options.encoding = 'UTF-8'
    options.compilerArgs << '-XDignore.symbol.file' // << "-Xlint:unchecked" << "-Xlint:deprecation"
}

tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dirMode = 0775
    fileMode = 0664
}

ext {
    bitcoinjcoreVersion = '0.15.6-rsk-5'
    bitcoinjVersion = '0.14.4-rsk-18'
    commonsLang3Version = '3.12.0'
    commonsIoVersion = '2.11.0'
    slf4jVersion = '1.7.36'
    javaxAnnotationApiVersion = '1.3.2'
    jacksonDatabindVersion = '2.15.4'
    typesafeVersion = '1.4.2'
    logbackVersion = '1.2.11'
    junitVersion = '5.10.3'
    junitSuiteVersion = '1.10.3'
    mockitoInlineVer  = '5.2.0'
    mockitoJupiterVer = '5.12.0'
    rskjcoreVersion = '9.1.0-SNAPSHOT'
}

dependencies {
    implementation "co.rsk:rskj-core:${rskjcoreVersion}"

    implementation "org.bitcoinj:core:${bitcoinjcoreVersion}"
    implementation "co.rsk.bitcoinj:bitcoinj-thin:${bitcoinjVersion}"
    implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
    implementation "commons-io:commons-io:${commonsIoVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "javax.annotation:javax.annotation-api:${javaxAnnotationApiVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
    implementation "com.typesafe:config:${typesafeVersion}"

    runtimeOnly "org.slf4j:log4j-over-slf4j:${slf4jVersion}"
    runtimeOnly "ch.qos.logback:logback-core:${logbackVersion}"
    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testImplementation "org.junit.platform:junit-platform-suite:${junitSuiteVersion}"
    testImplementation "org.mockito:mockito-inline:${mockitoInlineVer}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoJupiterVer}"
}

javadoc {
    options.author = true
    options.header = "FedNode"
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = "UTF-8"
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from javadoc
}

def generatedResources = "$buildDir/generated-resources"
sourceSets {
    main {
        resources {
            srcDirs += generatedResources
        }
    }
}

task generateResources {
    doLast {
        mkdir generatedResources
        def generated = new File(generatedResources, 'build-info.properties')
        def commitHash = gitCommitHash()
        def currentBranch = gitCurrentBranch()
        generated.text = """
build.hash=$commitHash
build.branch=$currentBranch
"""
    }
}

jar {
    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir
    from generatedResources
}

task fatJar(type: Jar, dependsOn: jar) {
    archiveClassifier = "all"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': "$mainClassName"
    }

    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    exclude "module-info.class"

    for (def jar in configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }) {
        from(jar) {
            eachFile { details -> amendPathIfNeeded(details) }
        }
    }

    with jar
}

artifacts {
    archives sourcesJar
    archives javadocJar
    archives fatJar
}

static def gitCurrentBranch() {
    def process = "git rev-parse --abbrev-ref HEAD".execute()
    return process.text.trim()
}

static def gitCommitHash() {
    def process = "git rev-parse --short HEAD".execute()
    return process.text.trim()
}

static def amendPathIfNeeded(details) {
    def uPath = details.path.toUpperCase()
    if (uPath.startsWith("META-INF/LICENSE") || uPath.startsWith("META-INF/NOTICE")) {
        def originalFile = details.file as File
        def jarName = originalFile.parentFile.parentFile.name.split(".jar")[0]
        def newPath = originalFile.parentFile.name + "/" + jarName + "_" + originalFile.name
        details.path = newPath
    }
}
